name: Build & Release PasswortGenerator (Linux)

# Releases entstehen nur bei einer Versionsänderung, nicht bei jedem Push.
on:
  push:
    branches: [main]
    paths:
      - version.py
      - 'tests/**'
      - .github/workflows/build-and-release.yml
  workflow_dispatch:

permissions:
  contents: write

# Verhindert parallele, doppelte Builds desselben Release-Zweigs.
concurrency:
  group: passwortgenerator-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check version before installing dependencies
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'from version import APP_VERSION; print(APP_VERSION)')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::APP_VERSION must be in MAJOR.MINOR.PATCH format"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG exists — no build or upload needed."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building release $TAG."
          fi

      - uses: actions/setup-python@v6
        if: steps.version.outputs.build == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install minimal Qt and test once
        if: steps.version.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Minimal Qt graphics runtime. Use cached apt indexes first.
          if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends libegl1 libopengl0; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends libegl1 libopengl0
          fi
          python -m pip install --disable-pip-version-check --prefer-binary \
            -r requirements.txt pyinstaller==6.22.3
          python -m py_compile main.py glass_ui.py neon_style.py theme_colors.py release_history.py password_core.py version.py updater.py diagnostics.py windows_support.py visual_help.py first_run_tour.py
          python -m compileall -q tests
          python -m unittest discover -s tests -v
          PYTHONPATH=. python tests/smoke_glossy_ui.py
          PYTHONPATH=. python tests/smoke_tabs_ui.py
          PYTHONPATH=. python tests/smoke_theme_history_ui.py
          PYTHONPATH=. python tests/smoke_update_navigation_ui.py
          PYTHONPATH=. python tests/smoke_first_run_tour_ui.py
          PYTHONPATH=. python tests/smoke_no_scroll_ui.py
          PYTHONPATH=. python tests/smoke_window_geometry_ui.py
          PYTHONPATH=. python tests/smoke_update_gui.py

      - name: Capture and publish real README screenshot
        if: steps.version.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/capture_readme_screenshot.py
          mkdir -p assets/screenshots
          install -m 0644 readme-screenshot.png assets/screenshots/passwort-generator.png
          git add assets/screenshots/passwort-generator.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "docs: refresh actual Qt screenshot for v$(python3 -c 'from version import APP_VERSION; print(APP_VERSION)')"
            git push origin HEAD:main
          fi

      - name: Build AppImage
        if: steps.version.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --windowed --name PasswortGenerator main.py

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/scalable/apps
          cp -r dist/PasswortGenerator AppDir/usr/bin/
          cp assets/de.timbooh.passwortgenerator.svg AppDir/de.timbooh.passwortgenerator.svg
          cp assets/de.timbooh.passwortgenerator.svg \
            AppDir/usr/share/icons/hicolor/scalable/apps/de.timbooh.passwortgenerator.svg

          cat > AppDir/AppRun <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PasswortGenerator/PasswortGenerator" "$@"
          SH
          chmod +x AppDir/AppRun

          cat > AppDir/de.timbooh.passwortgenerator.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=PasswortGenerator
          Exec=AppRun
          Icon=de.timbooh.passwortgenerator
          Categories=Utility;Security;
          Terminal=false
          DESKTOP
          cp AppDir/de.timbooh.passwortgenerator.desktop \
            AppDir/usr/share/applications/de.timbooh.passwortgenerator.desktop

          curl --fail --location --silent --show-error --retry 3 \
            -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage AppDir PasswortGenerator-x86_64.AppImage
          test -s PasswortGenerator-x86_64.AppImage
          sha256sum PasswortGenerator-x86_64.AppImage > SHA256SUMS

      - name: Publish verified release directly
        if: steps.version.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            PasswortGenerator-x86_64.AppImage \
            install.sh uninstall.sh SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "PasswortGenerator ${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --latest
