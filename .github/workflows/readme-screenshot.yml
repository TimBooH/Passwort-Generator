name: README Original Screenshot (Linux Qt)

# Documentation-only image capture. No version bump, no installer/release build.
on:
  push:
    branches: [main]
    paths:
      - tests/capture_readme_screenshot.py
      - .github/workflows/readme-screenshot.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: original-readme-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    # A preview run must never push screenshots straight to stable main.
    if: github.ref == 'refs/heads/main' && github.repository == 'TimBooH/Passwort-Generator'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Prepare Qt runtime on Ubuntu Linux
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends libegl1 libopengl0; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends libegl1 libopengl0
          fi
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt

      - name: Open running PasswortGenerator and capture its genuine Qt window
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python tests/capture_readme_screenshot.py
          test -s readme-screenshot.png
          file readme-screenshot.png | grep 'PNG image data'

      - name: Save actual screenshot in GitHub READMEs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/screenshots
          install -m 0644 readme-screenshot.png assets/screenshots/passwort-generator-live.png
          git add assets/screenshots/passwort-generator-live.png
          if git diff --cached --quiet; then
            echo "README screenshot is already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "docs: add original Linux PasswortGenerator Qt screenshot"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                rebase origin/main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: original-linux-qt-readme-screenshot
          path: assets/screenshots/passwort-generator-live.png
          retention-days: 14
