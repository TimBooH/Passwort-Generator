name: Unstable Preview - Linux & Windows

# Preview is published ONLY as a GitHub prerelease (never latest Stable).
# Linux and Windows must both pass before publishing.
on:
  push:
    branches: [unstable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unstable-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-preview:
    if: github.ref == 'refs/heads/unstable'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install minimal Linux/Qt dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0
          fi
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt pyinstaller==6.22.3
      - name: Test complete Linux app without releasing
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q -x '(^|/)dist/' .
          python -m unittest discover -s tests -v
          PYTHONPATH=. python tests/smoke_glossy_ui.py
          PYTHONPATH=. python tests/smoke_default_ocean_ui.py
          PYTHONPATH=. python tests/smoke_tabs_ui.py
          PYTHONPATH=. python tests/smoke_theme_history_ui.py
          PYTHONPATH=. python tests/smoke_update_navigation_ui.py
          PYTHONPATH=. python tests/smoke_no_scroll_ui.py
          PYTHONPATH=. python tests/smoke_language_ui.py
          PYTHONPATH=. python tests/smoke_profile_clipboard_ui.py
          PYTHONPATH=. python tests/smoke_v020_ui.py
          PYTHONPATH=. python tests/smoke_window_geometry_ui.py
          PYTHONPATH=. python tests/smoke_update_gui.py
          PYTHONPATH=. python tests/smoke_update_channels_ui.py
          PYTHONPATH=. python tests/capture_readme_screenshot.py
      - name: Upload genuine Linux application design screenshot
        uses: actions/upload-artifact@v4
        with:
          name: PasswortGenerator-UNSTABLE-Designvorschau
          path: readme-screenshot.png
          if-no-files-found: error
          retention-days: 14
      - name: Embed UNSTABLE build identity and verify isolation
        shell: bash
        run: |
          set -euo pipefail
          printf "CHANNEL = 'unstable'\nBUILD_SHA = '%s'\n" "${GITHUB_SHA:0:12}" > release_channel.py
          python - <<'PY'
          import os
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          from PySide6.QtWidgets import QApplication
          from main import PasswordWindow
          from release_channel import CHANNEL
          app = QApplication([])
          window = PasswordWindow(auto_check=True)
          assert CHANNEL == 'unstable'
          assert window.settings.applicationName() == 'PasswortGenerator-Unstable'
          assert window._auto_check
          assert window.update_channel == 'unstable'
          assert '[UNSTABLE]' in window.windowTitle()
          from release_channel import BUILD_SHA
          assert BUILD_SHA == os.environ['GITHUB_SHA'][:12]
          from update_channels import channel_api
          assert channel_api(window.update_channel).endswith('releases/tags/unstable')
          window.close()
          print('UNSTABLE isolated identity, settings, and updates verified')
          PY
      - name: Create standalone Linux UNSTABLE AppImage
        shell: bash
        run: |
          set -euo pipefail
          pyinstaller --noconfirm --clean --windowed --name PasswortGenerator --add-data "assets/fonts:assets/fonts" main.py
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -r dist/PasswortGenerator AppDir/usr/bin/
          cp assets/de.timbooh.passwortgenerator.svg AppDir/de.timbooh.passwortgenerator.svg
          cp assets/de.timbooh.passwortgenerator.svg AppDir/usr/share/icons/hicolor/scalable/apps/de.timbooh.passwortgenerator.svg
          cat > AppDir/AppRun <<'SH'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PasswortGenerator/PasswortGenerator" "$@"
          SH
          chmod +x AppDir/AppRun
          cat > AppDir/de.timbooh.passwortgenerator.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=PasswortGenerator UNSTABLE
          Exec=AppRun
          Icon=de.timbooh.passwortgenerator
          Categories=Utility;Security;
          Terminal=false
          DESKTOP
          curl --fail --location --silent --show-error --retry 3 -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          short="${GITHUB_SHA:0:12}"
          ARCH=x86_64 ./appimagetool.AppImage AppDir "PasswortGenerator-UNSTABLE-${short}-x86_64.AppImage"
          test -s "PasswortGenerator-UNSTABLE-${short}-x86_64.AppImage"
          sha256sum "PasswortGenerator-UNSTABLE-${short}-x86_64.AppImage" > SHA256SUMS-unstable-linux.txt
      - name: Upload Linux preview, not a public release
        uses: actions/upload-artifact@v4
        with:
          name: PasswortGenerator-UNSTABLE-Linux
          path: |
            PasswortGenerator-UNSTABLE-*-x86_64.AppImage
            SHA256SUMS-unstable-linux.txt
          if-no-files-found: error
          retention-days: 14

  windows-preview:
    if: github.ref == 'refs/heads/unstable'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Windows/Qt dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --prefer-binary -r requirements.txt pyinstaller==6.22.3 pillow
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install dependencies' }
      - name: Test Windows app before building preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Source syntax errors' }
          foreach ($test in @('test_password_core.py', 'test_glass_ui.py', 'test_release_history.py', 'test_localization.py', 'test_password_presets.py', 'test_windows_installer.py', 'test_v020_password_rules.py', 'test_updater.py', 'test_update_channels.py')) {
            python -m unittest discover -s tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "Failed test $test" }
          }
          foreach ($test in @('smoke_default_ocean_ui.py', 'smoke_tabs_ui.py', 'smoke_theme_history_ui.py', 'smoke_update_navigation_ui.py', 'smoke_no_scroll_ui.py', 'smoke_language_ui.py', 'smoke_profile_clipboard_ui.py', 'smoke_v020_ui.py', 'smoke_window_geometry_ui.py', 'smoke_update_channels_ui.py')) {
            python "tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Failed GUI smoke $test" }
          }
      - name: Embed UNSTABLE identity
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,12)
          @("CHANNEL = 'unstable'", "BUILD_SHA = '$short'") | Set-Content release_channel.py -Encoding ascii
          python -c "from release_channel import CHANNEL; assert CHANNEL == 'unstable'"
          if ($LASTEXITCODE -ne 0) { throw 'Unstable build identity missing' }
      - name: Package isolated Windows UNSTABLE app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/make_windows_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generator failed' }
          pyinstaller --noconfirm --clean --windowed --onedir --name PasswortGenerator --icon assets/passwortgenerator.ico --add-data "assets/passwortgenerator.ico;assets" --add-data "assets/fonts;assets/fonts" main.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows PyInstaller preview failed' }
          $exe = Join-Path $PWD 'dist\PasswortGenerator\PasswortGenerator.exe'
          $smoke = Start-Process -FilePath $exe -ArgumentList '--verify-bundle' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Preview executable startup failed: $($smoke.ExitCode)" }
      - name: Create separately installed Windows UNSTABLE installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup not available' }
          $short = $env:GITHUB_SHA.Substring(0,12)
          $source = Get-Content 'windows\PasswortGenerator.iss' -Raw
          $source = $source.Replace('#define MyAppName "PasswortGenerator"', '#define MyAppName "PasswortGenerator UNSTABLE"')
          $source = $source.Replace('AppId={{F06B418B-3DB8-42BA-95D1-BF5DDB0B775D}', 'AppId={{C1EB2C1F-55A6-44F6-B3AD-BED6CD63A3AF}')
          $source = $source.Replace('DefaultDirName={autopf}\PasswortGenerator', 'DefaultDirName={autopf}\PasswortGenerator-UNSTABLE')
          $source = $source.Replace('DefaultGroupName=PasswortGenerator', 'DefaultGroupName=PasswortGenerator UNSTABLE')
          $source = $source.Replace('OutputBaseFilename=PasswortGenerator-Setup-x64', "OutputBaseFilename=PasswortGenerator-UNSTABLE-$short-Setup-x64")
          $source = $source.Replace('Name: "{autoprograms}\PasswortGenerator"', 'Name: "{autoprograms}\PasswortGenerator UNSTABLE"')
          $source = $source.Replace('Name: "{autodesktop}\PasswortGenerator"', 'Name: "{autodesktop}\PasswortGenerator UNSTABLE"')
          $source = $source.Replace('AppUpdatesURL=https://github.com/TimBooH/Passwort-Generator/releases/latest', 'AppUpdatesURL=https://github.com/TimBooH/Passwort-Generator/actions')
          if (!$source.Contains('AppId={{C1EB2C1F-55A6-44F6-B3AD-BED6CD63A3AF}')) { throw 'Unstable installer would replace Stable!' }
          if (!$source.Contains('DefaultDirName={autopf}\PasswortGenerator-UNSTABLE')) { throw 'Unstable install folder not isolated!' }
          $source | Set-Content 'windows\PasswortGenerator-UNSTABLE.iss' -Encoding utf8
          $version = (python -c "from version import APP_VERSION; print(APP_VERSION)").Trim()
          & $iscc "/DMyAppVersion=$version" ".\windows\PasswortGenerator-UNSTABLE.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Preview installer build failed' }
          $installer = "release-windows\PasswortGenerator-UNSTABLE-$short-Setup-x64.exe"
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 10MB) { throw 'Preview installer invalid' }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PasswortGenerator-UNSTABLE-$short-Setup-x64.exe" | Set-Content release-windows\SHA256SUMS-unstable-windows.txt -Encoding ascii
      - name: Upload Windows preview, not a public release
        uses: actions/upload-artifact@v4
        with:
          name: PasswortGenerator-UNSTABLE-Windows
          path: |
            release-windows/PasswortGenerator-UNSTABLE-*-Setup-x64.exe
            release-windows/SHA256SUMS-unstable-windows.txt
          if-no-files-found: error
          retention-days: 14

  publish-unstable-prerelease:
    # Publish only to the dedicated TEST repository, never the source repository.
    needs: [linux-preview, windows-preview]
    if: github.ref == 'refs/heads/unstable' && github.repository == 'TimBooH/Passwort-Generator'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.UNSTABLE_RELEASE_TOKEN }}
      TEST_RELEASE_REPO: TimBooH/Passwort-Generator-Unstable
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PasswortGenerator-UNSTABLE-*
          path: preview-assets
          merge-multiple: true
      - name: Publish both verified builds only after both jobs succeed
        shell: bash
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:12}"
          linux="PasswortGenerator-UNSTABLE-${short}-x86_64.AppImage"
          windows="PasswortGenerator-UNSTABLE-${short}-Setup-x64.exe"
          test -s "preview-assets/$linux"
          test -s "preview-assets/$windows"
          # PowerShell's ASCII output on Windows can contain CRLF endings.
          # Normalize the checksum manifest, not the signed installer bytes.
          sed -i 's/\r$//' preview-assets/SHA256SUMS-unstable-windows.txt
          (cd preview-assets && sha256sum -c SHA256SUMS-unstable-linux.txt && sha256sum -c SHA256SUMS-unstable-windows.txt)
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::UNSTABLE_RELEASE_TOKEN fehlt: Linux/Windows-Builds sind bereit, aber keine Test-Veröffentlichung."
            exit 0
          fi
          if ! gh api "repos/$TEST_RELEASE_REPO/commits/main" --jq '.sha' >/dev/null 2>&1; then
            echo "::error::Das Test-Repository benötigt einen initialen main-Commit (README) und Token-Zugriff."
            exit 1
          fi
          title="PasswortGenerator Unstable $short"
          body="**UNSTABLE / TESTVERSION** – Nicht für den Produktiveinsatz!\n\nTest-Build vom Commit \`$GITHUB_SHA\`. Windows und Linux erfolgreich getestet.\n\nDie offizielle Stable-Version bleibt unter /releases/latest und wird davon nicht verändert."
          if gh release view unstable --repo "$TEST_RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit unstable --repo "$TEST_RELEASE_REPO" --title "$title" --notes "$body" --prerelease --latest=false
          else
            gh release create unstable --repo "$TEST_RELEASE_REPO" --target main --title "$title" --notes "$body" --prerelease --latest=false
          fi
          gh release upload unstable "preview-assets/$linux" "preview-assets/$windows" \
            --repo "$TEST_RELEASE_REPO"
          # Discard old preview assets only after both new files were published.
          # Names contain the build SHA; clients only select the exact pair.
          assets="$(gh api "repos/$TEST_RELEASE_REPO/releases/tags/unstable" --jq '.assets[] | [.id, .name] | @tsv')"
          while IFS=$'\t' read -r id filename; do
            [[ -n "$id" ]] || continue
            if [[ "$filename" != "$linux" && "$filename" != "$windows" ]]; then
              gh api -X DELETE "repos/$TEST_RELEASE_REPO/releases/assets/$id"
            fi
          done <<< "$assets"
          echo "Preview ready: https://github.com/$TEST_RELEASE_REPO/releases/tag/unstable"

